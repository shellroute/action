# TEST FIXTURE ONLY — not the public action. Identical to ../../../action.yml
# except that it has no api-key input and sets nothing named SHELLROUTE_API_KEY
# itself. It tests whether the calling step's `env:` reaches a composite
# action's run steps as inherited process environment.
name: 'Shellroute Run (env fixture)'
description: 'Test fixture: same as the public action, without the api-key input'

inputs:
  country:
    description: 'ISO country code (e.g. US, DE, GB)'
    required: true
  command:
    description: 'Command to run through the proxy'
    required: true
  version:
    description: 'Shellroute CLI version to install'
    required: false
    default: '0.1.6'

runs:
  using: 'composite'
  steps:
    - name: Wiring check (prints set/unset, never the value)
      shell: bash
      run: |
        if [ -n "${SHELLROUTE_API_KEY:-}" ]; then echo "SHELLROUTE_API_KEY: set"; else echo "SHELLROUTE_API_KEY: unset"; fi

    - name: Install shellroute
      shell: bash
      env:
        SR_VERSION: ${{ inputs.version }}
      run: |
        if ! [[ "$SR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid version format: $SR_VERSION"
          exit 1
        fi
        npm install -g "shellroute@$SR_VERSION"
        shellroute --version

    - name: Run through proxy
      shell: bash
      env:
        SR_COUNTRY: ${{ inputs.country }}
        SR_COMMAND: ${{ inputs.command }}
      run: |
        if ! [[ "$SR_COUNTRY" =~ ^[A-Za-z]{2}$ ]]; then
          echo "::error::Invalid country code: $SR_COUNTRY"
          exit 1
        fi
        shellroute run --no-stat "$SR_COUNTRY" -- bash -c "$SR_COMMAND"
