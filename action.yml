name: 'Shellroute Run'
description: 'Run a trusted shell command through a Shellroute country route in GitHub Actions.'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  country:
    description: 'ISO country code (e.g. US, DE, GB)'
    required: true
  command:
    description: 'Command to run through the proxy'
    required: true
  api-key:
    description: 'Shellroute API key from your repo secrets'
    required: true
  version:
    description: 'Shellroute CLI version to install'
    required: false
    default: '0.1.6'

outputs:
  exit-code:
    description: 'Exit code of the proxied command'
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Install shellroute
      shell: bash
      env:
        SR_VERSION: ${{ inputs.version }}
      run: |
        if ! [[ "$SR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid version format: $SR_VERSION"
          exit 1
        fi
        npm install -g "shellroute@$SR_VERSION"

    - name: Run through proxy
      id: run
      shell: bash
      env:
        SR_COUNTRY: ${{ inputs.country }}
        SR_COMMAND: ${{ inputs.command }}
        SHELLROUTE_API_KEY: ${{ inputs.api-key }}
      run: |
        if ! [[ "$SR_COUNTRY" =~ ^[A-Za-z]{2}$ ]]; then
          echo "::error::Invalid country code: $SR_COUNTRY"
          exit 1
        fi
        rc=0
        shellroute run --no-stat "$SR_COUNTRY" -- bash -c "$SR_COMMAND" || rc=$?
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        exit $rc
